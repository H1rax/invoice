<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Přihlášení — Faktury</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="login-page">
  <div class="card login-box">
    <div class="login-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg>
    </div>
    <h1>Přehled faktur</h1>
    <p class="sub">Přihlaste se svým e-mailem a heslem.</p>

    <div class="login-error" id="loginError"></div>

    <form class="login-form" id="loginForm">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="text" id="email" name="email" autocomplete="username" required autofocus />
      </div>
      <div class="field">
        <label for="password">Heslo</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button class="btn" type="submit" id="loginSubmit">Přihlásit se</button>
    </form>

    <div class="login-divider">nebo</div>

    <a class="btn google" href="/auth/google/login" id="googleBtn" hidden>
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.1 5.4 29.3 3.5 24 3.5 12.7 3.5 3.5 12.7 3.5 24S12.7 44.5 24 44.5 44.5 35.3 44.5 24c0-1.2-.1-2.4-.3-3.5z"/><path fill="#FF3D00" d="m6.3 14.6 6.6 4.8C14.6 15.6 18.9 12.5 24 12.5c3.1 0 5.8 1.1 8 3l6-6C34.1 5.4 29.3 3.5 24 3.5c-7.4 0-13.8 4.2-17 10.3z"/><path fill="#4CAF50" d="M24 44.5c5.2 0 9.9-1.8 13.6-4.8l-6.3-5.3c-2.1 1.5-4.7 2.4-7.3 2.4-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.9 40.1 16.4 44.5 24 44.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.3 5.3C41.4 35.9 44.5 30.4 44.5 24c0-1.2-.1-2.4-.3-3.5z"/></svg>
      Pokračovat přes Google
    </a>

    <p class="login-footer">Nemáte účet? <a href="/register">Zaregistrujte se</a></p>
  </div>

  <script src="/static/login.js"></script>
</body>
</html>
